name: release
permissions:
    contents: read

on:
    push:
        tags:
            - "v**[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:
        inputs:
            ref_name:
                type: string
                description: the refname to build a release from
                default: "latest"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    preflight:
        permissions:
            contents: write
        name: preflight
        runs-on: ubuntu-latest
        steps:
            - name: set ref_name
              shell: bash
              run: |
                  if [ -n "${INPUTS_REF_NAME}" ]; then
                    echo "REF_NAME=${INPUTS_REF_NAME}" >> $GITHUB_ENV
                  else
                    echo "REF_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV
                  fi
              env:
                INPUTS_REF_NAME: ${{ inputs.ref_name }}

            - name: create github release
              continue-on-error: true # for testing
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  release_url=$(gh release create $REF_NAME --generate-notes)

    release-linux:
        permissions:
            contents: write
        name: release-linux
        runs-on: ubuntu-latest
        needs: preflight
        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                persist-credentials: false

            - name: Install Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
              with:
                  cache-directories: |
                      ~/.cargo/registry
                      ~/.cargo/bin
                      target
                  cache: false

            - name: build for release and upload
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUTS_REF_NAME: ${{ inputs.ref_name }}
              run: |
                  REF_NAME="${GITHUB_REF_NAME}"
                  if [ -n "${INPUTS_REF_NAME}" ]; then
                      REF_NAME="${INPUTS_REF_NAME}"
                  fi
                  cargo +stable build --release
                  tar czf culture-ship-x86_64-unknown-linux-gnu.tar.gz --strip-components=2  target/release/culture-ship
                  gh release upload "$REF_NAME" "culture-ship-x86_64-unknown-linux-gnu.tar.gz"

    release-macos:
        permissions:
            contents: write
        name: release-macos
        runs-on: macos-latest
        needs: preflight
        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                persist-credentials: false

            - name: Install Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6
              with:
                  cache-directories: |
                      ~/.cargo/registry
                      ~/.cargo/bin
                      target
                  cache: false

            - name: build for release
              run: |
                  cargo +stable build --release --target aarch64-apple-darwin
                  cargo +stable build --release --target x86_64-apple-darwin

            - name: upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  INPUTS_REF_NAME: ${{ inputs.ref_name }}
              run: |
                  REF_NAME="${GITHUB_REF_NAME}"
                  if [ -n "${INPUTS_REF_NAME}" ]; then
                      REF_NAME="${INPUTS_REF_NAME}"
                  fi
                  mkdir -p dist
                  cd dist
                  for target in "aarch64-apple-darwin" "x86_64-apple-darwin"; do
                      tar czf culture-ship-$target.tar.gz --strip-components=4  ../target/$target/release/culture-ship
                      gh release upload "$REF_NAME" "culture-ship-$target.tar.gz"
                  done

    postflight:
        permissions:
            contents: write
        name: postflight
        runs-on: ubuntu-latest
        needs:
            #n- release-linux
            - release-macos
        steps:
            - name: checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                persist-credentials: false

            - name: get formulaic on path
              shell: bash
              run: |
                  curl -sLo formulaic.tgz https://github.com/ceejbot/formulaic/releases/latest/download/formulaic-x86_64-unknown-linux-gnu.tar.gz
                  tar --strip-components=3 -xzf formulaic.tgz ./target/release/formulaic

            - name: set ref_name
              shell: bash
              run: |
                  if [ -n "${INPUTS_REF_NAME}" ]; then
                    echo "REF_NAME=${INPUTS_REF_NAME}" >> $GITHUB_ENV
                  else
                    echo "REF_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV
                  fi
              env:
                INPUTS_REF_NAME: ${{ inputs.ref_name }}

            - name: publish the draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: gh release edit "$REF_NAME" --draft=false

            - name: update the homebrew tap
              env:
                  GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  formula_file=$(./formulaic ./Cargo.toml)
                  gh repo clone ceejbot/homebrew-tap
                  cd homebrew-tap || exit 1
                  cp "../$formula_file" Formula/
                  git add Formula/"$formula_file"
                  git config user.name "formula robot"
                  git config user.email "ceejceej@gmail.com"
                  git commit -m "culture-ship $REF_NAME"
                  git push https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/ceejbot/homebrew-tap.git
